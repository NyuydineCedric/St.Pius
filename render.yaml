services:
  - type: web
    name: st-pius-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Paste your Supabase connection string here in the Render dashboard
      # (Project Settings > Database > Connection string > URI). Not set
      # via this file since it's a secret.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: BIND_HOST
        value: 0.0.0.0

databases:
  - name: st-pius-db
    plan: free
    databaseName: reportcard
    user: reportcard

services:
  - type: web
    name: st-pius-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: st-pius-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false
      - key: BIND_HOST
        value: 0.0.0.0
